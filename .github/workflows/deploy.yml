name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ROLE_ARN: arn:aws:iam::530138265576:role/bucknam-site-dev-github-deploy
      BUCKET: bucknam-website-dev
      DISTRIBUTION_ID: E1ZQYRUUNNHUKM
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Two-pass sync:
      # 1. Upload hashed assets first with a year-long immutable cache. These paths
      #    only appear in /_astro/ and are safe to pin forever (Astro rewrites the
      #    filename when the content changes).
      # 2. Upload everything else (HTML, plain /data/, /images/, /admin/) with a
      #    no-cache header so browsers always revalidate — fixes the "CMS change
      #    landed on the server but my browser is still showing old data" problem.
      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync dist/_astro/ s3://${{ env.BUCKET }}/_astro/ \
            --cache-control "public, max-age=31536000, immutable"
      - name: Sync everything else (no cache)
        run: |
          aws s3 sync dist/ s3://${{ env.BUCKET }}/ --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "_astro/*"

      - name: Invalidate CloudFront
        run: |
          INV=$(aws cloudfront create-invalidation --distribution-id ${{ env.DISTRIBUTION_ID }} --paths '/*' --query 'Invalidation.Id' --output text)
          echo "Invalidation: $INV"
