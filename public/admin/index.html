<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucknam — Content Manager</title>
  <link rel="icon" type="image/png" href="/Logo_street_35px.png" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    /* Colored left border on Cities list cards, matching the Service Map legend */
    a[data-survey="yes"] { box-shadow: inset 4px 0 0 #3b82f6 !important; }
    a[data-survey="no"]  { box-shadow: inset 4px 0 0 #22c55e !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script>
    /* Tag each Cities list card with data-survey based on its summary text.
       The styles above use that attribute to render a coloured left bar. */
    (function () {
      let logged = false;
      function tag() {
        const cards = document.querySelectorAll('a[href*="/collections/cities/entries/"]');
        if (!logged && cards.length > 0) {
          logged = true;
          console.log('[bucknam] found', cards.length, 'cities cards; sample text:', cards[0].textContent);
        }
        cards.forEach((card) => {
          const txt = (card.textContent || '').toLowerCase();
          // Decap may render the isCustomer boolean as "true"/"false" OR just omit
          // the value when falsy. Match either explicit truthy words or a trailing
          // "this year:" with nothing after (the falsy case).
          const isYes = /surveying this year:\s*(true|yes|1)\b/.test(txt);
          const hasPhrase = /surveying this year:/.test(txt);
          if (isYes) card.setAttribute('data-survey', 'yes');
          else if (hasPhrase) card.setAttribute('data-survey', 'no');
        });
      }
      new MutationObserver(tag).observe(document.body, { childList: true, subtree: true });
      tag();
    })();
  </script>
</body>
</html>
